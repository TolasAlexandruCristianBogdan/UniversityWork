<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Exercise 7 - Letter Spacing</title>
  <style>
    h1 {
      letter-spacing: 1px;
    }

    h2 {
      letter-spacing: 3px;
    }

    p {
      letter-spacing: 5px;
    }
  </style>
</head>
<body>
  <h1>This is an H1</h1>
  <h2>This is an H2</h2>
  <p>This paragraph has wide letter spacing.</p>
</body>
</html>
