<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Exercise 6 - Font Variant</title>
  <style>
    .smallcaps {
      font-variant: small-caps;
    }

    .normal {
      font-variant: normal;
    }

    .inherit {
      font-variant: inherit;
    }
  </style>
</head>
<body>
  <div style="font-variant: small-caps;">
    <p class="smallcaps">This paragraph uses small-caps.</p>
    <p class="normal">This paragraph uses normal font-variant.</p>
    <p class="inherit">This paragraph inherits font-variant from parent.</p>
  </div>
</body>
</html>
