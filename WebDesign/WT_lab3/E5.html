<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Exercise 5 - Pseudo-elements</title>
  <style>
    p::first-letter {
      color: red;
      font-size: 150%;
    }

    p::first-line {
      color: red;
      text-transform: capitalize;
    }
  </style>
</head>
<body>
  <p>this is a sample paragraph to demonstrate the first-letter and first-line styling using pseudo-elements in CSS.</p>
</body>
</html>
